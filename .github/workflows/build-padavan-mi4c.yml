name: Build Padavan MI-4C (AWG + WiFi 4.0)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake autopoint cmake bison build-essential flex gawk \
            gettext git gperf libtool libtool-bin pkg-config fakeroot kmod cpio \
            doxygen texinfo help2man libncurses5-dev zlib1g-dev libsqlite3-dev \
            gcc-multilib curl dos2unix unzip wget locales xxd libltdl-dev \
            libgmp3-dev libmpfr-dev libarchive-tools libblkid-dev ca-certificates \
            zstd mc
          sudo locale-gen --no-purge en_US.UTF-8 ru_RU.UTF-8

      - name: Clone exact Padavan source
        run: |
          set -eux
          git clone https://github.com/nilabsent/padavan-ng.git padavan-ng
          cd padavan-ng
          git checkout d2c5846299949c57a4e867284069900b561dd2a4
          git rev-parse HEAD

      - name: Configure MI-4C for AmneziaWG and stable MT7628 WiFi driver
        run: |
          set -eux
          cd padavan-ng/trunk
          cp configs/templates/XIAOMI/mi-4c.config .config
          sed -i 's/^CONFIG_FIRMWARE_WIFI2_DRIVER=.*/CONFIG_FIRMWARE_WIFI2_DRIVER=4.0/' .config
          sed -i 's/^#CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG=y/CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG=y/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y/#CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y/' .config
          grep -E 'CONFIG_FIRMWARE_PRODUCT_ID|CONFIG_FIRMWARE_WIFI2_DRIVER|CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG|CONFIG_FIRMWARE_INCLUDE_WIREGUARD' .config

      - name: Build toolchain
        run: |
          set -eux
          cd padavan-ng/toolchain
          chmod +x build_toolchain.sh
          ./build_toolchain.sh

      - name: Build firmware
        run: |
          set -eux
          cd padavan-ng/trunk
          chmod +x clear_tree.sh build_firmware.sh
          ./clear_tree.sh || true
          ./build_firmware.sh
          ls -lah images
          test -n "$(find images -maxdepth 1 -type f -name '*.trx' -print -quit)"

      - name: Record build metadata
        if: always()
        run: |
          mkdir -p output
          if [ -d padavan-ng/trunk/images ]; then
            cp -av padavan-ng/trunk/images/*.trx output/ 2>/dev/null || true
          fi
          cp -av padavan-ng/trunk/.config output/mi-4c-build.config 2>/dev/null || true
          {
            echo "source=nilabsent/padavan-ng"
            echo "commit=d2c5846299949c57a4e867284069900b561dd2a4"
            echo "target=MI-4C"
            echo "wifi_driver=4.0 (MT7628 v4.0.1.3)"
            echo "amneziawg=enabled"
            date -u +"built_utc=%Y-%m-%dT%H:%M:%SZ"
          } > output/BUILD-INFO.txt
          sha256sum output/*.trx > output/SHA256SUMS.txt 2>/dev/null || true

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MI-4C-Padavan-AWG-WiFi4.0
          path: output/
          if-no-files-found: error
          retention-days: 7
